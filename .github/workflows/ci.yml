name: CI

# Automatic Actions are temporarily disabled because the maintainer account
# is locked by a GitHub billing issue. Re-enable push/pull_request once fixed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: macos-latest, node: 20 }
          - { os: windows-latest, node: 20 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: ${{ matrix.node }}, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run smoke
